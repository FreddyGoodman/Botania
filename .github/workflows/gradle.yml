name: Java CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
      with:
        persist-credentials: false
    - name: Set up JDK
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '25'
    - name: Validate gradlew integrity
      uses: gradle/actions/wrapper-validation@v5
    - name: Check lang files
      run: ./scripts/check_lang.sh
    - name: Calculate artifact names
      id: calculate_artifact_names
      run: |
        # Check is backwards because "" is falsey, which wouldn't work for boolean punning
        SNAPSHOT_SUFFIX=${{ !startsWith(github.ref, 'refs/tags/release-') && '-SNAPSHOT' || '' }}
        MC=$(awk -F '=' '$1~/^minecraft_version$/ { print $2; }' gradle.properties)
        BUILD=$(awk -F '=' '$1~/^build_number$/ { print $2; }' gradle.properties)
        echo "neoforge=NeoForge/build/libs/botania-neoforge-${MC}-${BUILD}${SNAPSHOT_SUFFIX}.jar" >> "$GITHUB_OUTPUT"
        echo "fabric=Fabric/build/libs/botania-fabric-${MC}-${BUILD}${SNAPSHOT_SUFFIX}.jar" >> "$GITHUB_OUTPUT"
    - name: Build with Gradle
      run: |
        RELEASE_MODE=${{ startsWith(github.ref, 'refs/tags/release-') && '1' || '0' }} \
        ./gradlew pmdMain spotlessJavaCheck build test
    - name: Check generated files up to date
      run: ./scripts/check_datagen.sh
    - name: Archive Fabric Artifacts
      uses: actions/upload-artifact@v7
      with:
        name: Fabric
        path: ${{ steps.calculate_artifact_names.outputs.fabric }}
        if-no-files-found: error
    - name: Archive NeoForge Artifacts
      uses: actions/upload-artifact@v7
      with:
        name: NeoForge
        path: ${{ steps.calculate_artifact_names.outputs.neoforge }}
        if-no-files-found: error
