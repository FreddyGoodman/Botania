plugins {
    id("multiloader-loader")
    alias(libs.plugins.mdg)
}

repositories {
    maven {
        name = "C4"
        url = "https://maven.theillusivec4.top/"
    }
}

def datagenOutput = providers.environmentVariable("BOTANIA_DATAGEN_OUTPUT").map { file(it) }.getOrNull()

neoForge {
    version = neoforge_version
    // Automatically enable neoforge AccessTransformers if the file exists
    def at = project(":Xplat").file("src/main/resources/META-INF/accesstransformer.cfg")
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }

    runs {
        configureEach {
            systemProperty("neoforge.enabledGameTestNamespaces", mod_id)
            systemProperty("fml.earlyprogresswindow", "false")
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})" // Unify the run config names with fabric
            gameDirectory = file(providers.environmentVariable("BOTANIA_TEST_RUN").orElse("../run/").get())
        }

        gameTestServer {
            type = "gameTestServer"
            def filter = providers.environmentVariable("BOTANIA_TEST_FILTER").getOrNull()
            if (filter != null) {
                programArguments.addAll("--tests", filter)
            }
            def report = providers.environmentVariable("BOTANIA_TEST_REPORT").getOrNull()
            if (report != null) {
                programArguments.addAll("--report", report)
            }
            def fixtures = providers.environmentVariable("BOTANIA_TEST_FIXTURES").getOrNull()
            if (fixtures != null) {
                systemProperty("botania.gametest.fixtures", fixtures)
            }
        }

        client {
            client()
            systemProperty("neoforge.logging.console.level", "debug")
        }
        neoforgeDatagen {
            serverData()
            programArguments.addAll("--mod", mod_id, "--server", "--flat",
                    "--output", (datagenOutput == null ? file("src/generated/resources/") : new File(datagenOutput, "neoforge")).getAbsolutePath(),
                    "--existing", file("src/main/resources/").getAbsolutePath())
        }
        gardenOfGlassDatagen {
            serverData()
            programArguments.addAll("--mod", mod_id, "--server", "--flat",
                    "--output", (datagenOutput == null ? file("../garden_of_glass/src/generated/resources/") : new File(datagenOutput, "garden_of_glass")).getAbsolutePath(),
                    "--existing", file("../garden_of_glass/src/main/resources/").getAbsolutePath())
            systemProperty("botania.gog_datagen", "1")
        }
        server {
            server()
            systemProperty("neoforge.logging.console.level", "debug")
            programArgument("--nogui")
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    compileOnly(libs.jetbrains.annotations)

    implementation(libs.patchouli.neoforge)
    compileOnly(variantOf(libs.curios) { classifier("api") })

    compileOnly(libs.jei.neoforge.api)
    compileOnly(libs.rei.neoforge)

    compileOnly(libs.ears)
    // Sodium ships its NeoForge classes inside a nested jar. The sprite API is shared with Fabric.
    compileOnly(libs.sodium.fabric) { transitive = false }
    compileOnly(libs.embeddium) { transitive = false }

    runtimeOnly(libs.curios)

    if (rootProject.hasProperty("load_override_rei")) {
        runtimeOnly(libs.rei.neoforge)
    } else {
        runtimeOnly(libs.jei.neoforge.full)
    }

    if (file("../garden_of_glass/gardenofglass-${gog_version}.jar").exists()) {
        runtimeOnly(files("../garden_of_glass/gardenofglass-${gog_version}.jar"))
    }
}
